name: Bass Boost
description: Enhanced bass with warm low-end boost
custom: false
stems:
  vocals:
    volume: 0.8
    effects:
      eq: {low_gain: 0, mid_gain: -1, high_gain: 1}
      reverb: {room_size: 0, damping: 0.5, wet_level: 0}
      delay: {delay_seconds: 0, feedback: 0, mix: 0}
      compressor: {threshold_db: -15, ratio: 3, attack_ms: 10}
      pan: 0
  drums:
    volume: 0.9
    effects:
      eq: {low_gain: 2, mid_gain: 0, high_gain: 0}
      reverb: {room_size: 0, damping: 0.5, wet_level: 0}
      delay: {delay_seconds: 0, feedback: 0, mix: 0}
      compressor: {threshold_db: -10, ratio: 2, attack_ms: 10}
      pan: 0
  bass:
    volume: 1.3
    effects:
      eq: {low_gain: 6, mid_gain: 0, high_gain: -1}
      reverb: {room_size: 0, damping: 0.5, wet_level: 0}
      delay: {delay_seconds: 0, feedback: 0, mix: 0}
      compressor: {threshold_db: -12, ratio: 3, attack_ms: 15}
      pan: 0
  guitar:
    volume: 0.8
    effects:
      eq: {low_gain: -2, mid_gain: 0, high_gain: 0}
      reverb: {room_size: 0, damping: 0.5, wet_level: 0}
      delay: {delay_seconds: 0, feedback: 0, mix: 0}
      compressor: {threshold_db: 0, ratio: 1, attack_ms: 10}
      pan: 0
  piano:
    volume: 0.8
    effects:
      eq: {low_gain: -2, mid_gain: 0, high_gain: 0}
      reverb: {room_size: 0, damping: 0.5, wet_level: 0}
      delay: {delay_seconds: 0, feedback: 0, mix: 0}
      compressor: {threshold_db: 0, ratio: 1, attack_ms: 10}
      pan: 0
  other:
    volume: 0.8
    effects:
      eq: {low_gain: -2, mid_gain: 0, high_gain: 0}
      reverb: {room_size: 0, damping: 0.5, wet_level: 0}
      delay: {delay_seconds: 0, feedback: 0, mix: 0}
      compressor: {threshold_db: 0, ratio: 1, attack_ms: 10}
      pan: 0
